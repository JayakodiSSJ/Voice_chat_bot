<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Copilot Chat (Text Only)</title>
    <script src="https://cdn.botframework.com/botframework-webchat/latest/webchat.js"></script>
</head>
<body>


    <div id="webchat" style="width: 100%; height: 500px;"></div>

    <script>
        (async function () {
            try {
                if (!window.WebChat) {
                    console.error("WebChat library not loaded.");
                    return;
                }

                // Fetch the Direct Line token from the Flask backend
                const response = await fetch("/get_token_test");
                const data = await response.json();

                if (!data.token) {
                    console.error("Token not found in the response.");
                    return;
                }

                const directLineToken = data.token;
                const directLine = window.WebChat.createDirectLine({ token: directLineToken });

                // Render the chatbot with only text input (no speech support)
                window.WebChat.renderWebChat(
                    {
                        directLine: directLine,
                        userID: "user-123",
                        username: "User",
                        locale: "en-US",
                        styleOptions: {
                            botAvatarInitials: "AI",
                            userAvatarInitials: "U",
                            bubbleBackground: "#F1F1F1",
                            bubbleFromUserBackground: "#0078D7",
                            bubbleFromUserTextColor: "white"
                        }
                    },
                    document.getElementById("webchat")
                );

                console.log("Text-only chatbot loaded successfully!");
            } catch (error) {
                console.error("Error loading chatbot:", error);
            }
        })();
    </script>
</body>
</html>
