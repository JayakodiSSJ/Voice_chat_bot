server {
listen 80;
server_tokens off;
autoindex off;

add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; script-src 'self' 'wasm-unsafe-eval' https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://fonts.googleapis.com; font-src 'self' data: https://cdnjs.cloudflare.com https://fonts.gstatic.com; img-src 'self' data: blob: https://img.freepik.com https://img.icons8.com https://*.googleusercontent.com https://*.gstatic.com; media-src 'self' blob:; connect-src 'self' blob: https://login.microsoftonline.com https://graph.microsoft.com https://*.googleapis.com https://*.firebaseio.com https://*.firebaseapp.com https://*.firebasestorage.app https://securetoken.googleapis.com https://identitytoolkit.googleapis.com https://firestore.googleapis.com https://directline.botframework.com wss://directline.botframework.com; frame-src 'self' https://login.microsoftonline.com https://*.firebaseapp.com; worker-src 'self' blob:; manifest-src 'self'; form-action 'self'; upgrade-insecure-requests" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;

location /api {
    proxy_pass http://backend:5000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
}

location ~ ^/(static|assets|css|js|media|images|fonts)(?:/.*)?/$ {
    return 404;
}

location / {
root /usr/share/nginx/html;
index index.html;
try_files $uri /index.html;
}

location ~ /\.(?!well-known) {
    deny all;
}
}
