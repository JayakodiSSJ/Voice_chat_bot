apiVersion: apps/v1
kind: Deployment
metadata:
  name: aisle-backend
  namespace: aisle-agent
  labels:
    app: aisle-backend
    tier: backend
spec:
  replicas: 2  # Run 2 instances for redundancy
  selector:
    matchLabels:
      app: aisle-backend
      tier: backend
  template:
    metadata:
      labels:
        app: aisle-backend
        tier: backend
    spec:
      containers:
      - name: aisle-backend
        image: tharukadi/aisle-backend:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5000
          name: http
        env:
        - name: FLASK_ENV
          value: "production"
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: aisle-postgres-secret
              key: DATABASE_URL
        - name: QDRANT_URL
          value: "http://aisle-qdrant-service:6333"
        - name: QDRANT_VECTOR_SIZE
          value: "1536"
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /
            port: 5000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 5000
          initialDelaySeconds: 5
          periodSeconds: 5
