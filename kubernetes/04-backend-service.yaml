apiVersion: v1
kind: Service
metadata:
  name: aisle-backend-service
  namespace: aisle-agent
  labels:
    app: aisle-backend
spec:
  type: ClusterIP  # Internal service for backend
  selector:
    app: aisle-backend
    tier: backend
  ports:
  - port: 5000
    targetPort: 5000
    protocol: TCP
    name: http
