# User and worker processes
user www-data; # Adjust the user if needed
worker_processes auto; 
pid /run/nginx.pid;

# Network settings
events {
    worker_connections 768;
}

# HTTP settings and optimizations
http {
    include mime.types; 
    default_type application/octet-stream;
    server_tokens off;

    # Logging
    access_log /var/log/nginx/access.log; 
    error_log /var/log/nginx/error.log;

    # Caching and compression
    sendfile on;
    gzip on;
    gzip_disable "msie6"; 
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # React application configuration
    server {
        listen 80;
        server_name aisleagents.raccoon-ai.com; 
        root /usr/share/nginx/html; 
        index index.html;
        autoindex off;

        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; script-src 'self' https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://fonts.googleapis.com; font-src 'self' data: https://cdnjs.cloudflare.com https://fonts.gstatic.com; img-src 'self' data: blob: https://img.freepik.com https://img.icons8.com https://*.googleusercontent.com https://*.gstatic.com; connect-src 'self' https://login.microsoftonline.com https://graph.microsoft.com https://*.googleapis.com https://*.firebaseio.com https://*.firebaseapp.com https://*.firebasestorage.app https://securetoken.googleapis.com https://identitytoolkit.googleapis.com https://firestore.googleapis.com https://directline.botframework.com wss://directline.botframework.com; frame-src 'self' https://login.microsoftonline.com https://*.firebaseapp.com; worker-src 'self' blob:; manifest-src 'self'; form-action 'self'; upgrade-insecure-requests" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;

        # ACME challenge for Let's Encrypt / Certbot
        location ~ /\.well-known/acme-challenge {
            allow all;
            root /usr/share/nginx/html;
            try_files $uri =404;
        }

        location ~ /\.(?!well-known) {
            deny all;
        }

        location ~ ^/(static|assets|css|js|media|images|fonts)(?:/.*)?/$ {
            return 404;
        }

        # Main frontend route
        location / {
            try_files $uri /index.html;
        }

        location /api {
            proxy_pass http://localhost:5000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Cache static assets
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
            expires 1y;
            add_header Cache-Control "public";
            add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; script-src 'self' https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://fonts.googleapis.com; font-src 'self' data: https://cdnjs.cloudflare.com https://fonts.gstatic.com; img-src 'self' data: blob: https://img.freepik.com https://img.icons8.com https://*.googleusercontent.com https://*.gstatic.com; connect-src 'self' https://login.microsoftonline.com https://graph.microsoft.com https://*.googleapis.com https://*.firebaseio.com https://*.firebaseapp.com https://*.firebasestorage.app https://securetoken.googleapis.com https://identitytoolkit.googleapis.com https://firestore.googleapis.com https://directline.botframework.com wss://directline.botframework.com; frame-src 'self' https://login.microsoftonline.com https://*.firebaseapp.com; worker-src 'self' blob:; manifest-src 'self'; form-action 'self'; upgrade-insecure-requests" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
            add_header X-Content-Type-Options "nosniff" always;
        }
    }

    # Optional: Server for static assets (if you have a separate domain) 
    # server {
    #     listen 80;
    #     server_name assets.yourdomain.com;
    #     root /var/www/yourdomain.com/assets; 
    #     index index.html;

    #     # ... (add caching rules here as well)
    # }
}
